name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quacker
          POSTGRES_PASSWORD: quacker
          POSTGRES_DB: quacker
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U quacker -d quacker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create env files
        run: pnpm env:check

      - name: Generate Prisma client
        run: pnpm backend prisma:generate

      - name: Format check
        run: pnpm format:check

      - name: Lint backend
        run: pnpm backend lint:check

      - name: Lint frontend
        run: pnpm frontend lint:check

      - name: Type-check frontend
        run: pnpm frontend type-check

      - name: Test backend
        run: pnpm backend test

      - name: Apply database migrations
        run: pnpm backend migrate

      - name: Test poll concurrency and live notifications
        run: pnpm backend test:polls:integration

      - name: Test frontend
        run: pnpm frontend test:ci

      - name: Build backend
        run: pnpm backend build

      - name: Build frontend
        run: pnpm frontend build
